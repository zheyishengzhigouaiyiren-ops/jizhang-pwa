<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>记账 PWA</title>
  <meta name="theme-color" content="#2f6fed" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="记账" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <style>
    :root{
      --bg:#f6f7fb;
      --card:#fff;
      --text:#1f2430;
      --muted:#8d94a3;
      --line:#eceef3;
      --primary:#2f6fed;
      --primary-soft:#eaf1ff;
      --expense:#ef5350;
      --income:#21a366;
      --shadow:0 10px 30px rgba(29,35,48,.08);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    .app{
      max-width:460px;
      margin:0 auto;
      min-height:100vh;
      padding-bottom:86px;
    }
    .hero{
      background:linear-gradient(135deg,#2f6fed,#5a8cff);
      color:#fff;
      padding:26px 20px 24px;
      border-radius:0 0 28px 28px;
      box-shadow:var(--shadow);
    }
    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:20px;
    }
    .title{font-size:21px;font-weight:800}
    .month{
      padding:7px 11px;
      border-radius:999px;
      background:rgba(255,255,255,.16);
      font-size:12px;
    }
    .balance-label{font-size:12px;opacity:.85}
    .balance{
      font-size:34px;
      font-weight:800;
      margin:6px 0 16px;
    }
    .summary{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }
    .summary .box{
      background:rgba(255,255,255,.14);
      padding:12px 13px;
      border-radius:15px;
    }
    .summary .label{font-size:11px;opacity:.8}
    .summary .value{font-size:17px;font-weight:700;margin-top:4px}

    .content{padding:18px}
    .section{
      background:var(--card);
      border-radius:20px;
      padding:17px;
      box-shadow:0 6px 20px rgba(29,35,48,.05);
      margin-bottom:16px;
    }
    .section-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:13px;
    }
    .section-title{font-size:16px;font-weight:800}
    .small-btn{
      border:0;
      background:var(--primary-soft);
      color:var(--primary);
      border-radius:10px;
      padding:8px 10px;
      font-size:12px;
      font-weight:700;
      cursor:pointer;
    }

    .quick-stats{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
    }
    .stat{
      background:#f7f8fb;
      border-radius:14px;
      padding:12px 9px;
      text-align:center;
    }
    .stat strong{display:block;font-size:16px;margin-top:4px}
    .stat span{font-size:11px;color:var(--muted)}

    .bill{
      display:flex;
      align-items:center;
      padding:11px 0;
      border-bottom:1px solid var(--line);
    }
    .bill:last-child{border-bottom:0}
    .icon{
      width:40px;height:40px;border-radius:13px;
      display:grid;place-items:center;
      background:#f3f5f9;
      font-size:19px;
      flex:0 0 auto;
    }
    .bill-main{flex:1;margin-left:11px}
    .bill-name{font-size:14px;font-weight:700}
    .bill-note{font-size:11px;color:var(--muted);margin-top:3px}
    .amount{font-weight:800;font-size:14px}
    .expense{color:var(--expense)}
    .income{color:var(--income)}

    .fab{
      position:fixed;
      left:50%;
      transform:translateX(-50%);
      bottom:28px;
      width:62px;height:62px;
      border-radius:22px;
      border:none;
      background:var(--primary);
      color:#fff;
      font-size:33px;
      box-shadow:0 10px 28px rgba(47,111,237,.35);
      cursor:pointer;
      z-index:20;
    }
    .nav{
      position:fixed;
      left:50%;transform:translateX(-50%);
      bottom:0;width:min(460px,100%);height:64px;
      background:rgba(255,255,255,.96);
      border-top:1px solid var(--line);
      display:grid;grid-template-columns:1fr 1fr 1fr 1fr;
      align-items:center;text-align:center;
      font-size:12px;color:var(--muted);
      z-index:10;
      backdrop-filter:blur(12px);
    }
    .nav div:nth-child(2){margin-right:34px}
    .nav div:nth-child(3){margin-left:34px}
    .nav .active{color:var(--primary);font-weight:800}

    .overlay{
      position:fixed; inset:0;
      background:rgba(12,18,28,.42);
      display:none;
      align-items:flex-end;
      justify-content:center;
      z-index:50;
    }
    .overlay.show{display:flex}
    .sheet{
      width:min(460px,100%);
      max-height:92vh;
      overflow:auto;
      background:#fff;
      border-radius:26px 26px 0 0;
      padding:18px 18px 26px;
      animation:rise .2s ease-out;
    }
    @keyframes rise{from{transform:translateY(20px);opacity:.7}to{transform:translateY(0);opacity:1}}
    .sheet-title{
      display:flex;align-items:center;justify-content:space-between;
      font-size:18px;font-weight:800;margin-bottom:14px
    }
    .close-x{
      width:32px;height:32px;border:none;border-radius:10px;
      background:#f3f4f7;font-size:20px;cursor:pointer;
    }
    .tabs{
      display:grid;grid-template-columns:1fr 1fr;
      background:#f2f4f8;border-radius:14px;padding:4px;margin-bottom:14px;
    }
    .tab{
      border:none;background:transparent;padding:9px;border-radius:11px;
      font-size:14px;font-weight:800;color:#7b8291;cursor:pointer;
    }
    .tab.active{background:#fff;color:var(--primary);box-shadow:0 3px 10px rgba(0,0,0,.06)}

    .field{margin-bottom:13px}
    .field label{display:block;font-size:11px;color:var(--muted);margin-bottom:7px}
    .field input,.field select{
      width:100%;border:1px solid #dfe3ea;border-radius:13px;
      padding:12px 13px;font-size:15px;outline:none;background:#fff;
    }
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

    .category-head{
      display:flex;align-items:center;justify-content:space-between;
      margin-bottom:8px;
    }
    .category-head span{font-size:11px;color:var(--muted)}
    .manage-btn{
      border:none;background:transparent;color:var(--primary);
      font-size:12px;font-weight:700;cursor:pointer;
    }
    .category-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:8px;
      margin-bottom:14px;
    }
    .cat{
      border:1px solid #e7e9ef;
      background:#fff;
      border-radius:13px;
      padding:10px 5px 9px;
      text-align:center;
      cursor:pointer;
    }
    .cat.active{
      border-color:#9db7ff;
      background:var(--primary-soft);
      color:var(--primary);
    }
    .cat-icon{font-size:21px;line-height:1.1}
    .cat-name{
      font-size:11px;font-weight:700;margin-top:5px;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }

    .save{
      width:100%;border:none;background:var(--primary);color:#fff;
      border-radius:14px;padding:13px;font-size:15px;font-weight:800;cursor:pointer;
    }
    .cancel{
      width:100%;border:none;background:#f2f4f8;color:#596173;
      border-radius:14px;padding:11px;font-size:13px;font-weight:700;margin-top:8px;cursor:pointer;
    }

    .manager{
      position:fixed; inset:0;
      background:rgba(12,18,28,.42);
      z-index:80;
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
    }
    .manager.show{display:flex}
    .manager-card{
      width:min(420px,100%);
      max-height:80vh;
      overflow:auto;
      background:#fff;
      border-radius:22px;
      padding:18px;
      box-shadow:0 18px 50px rgba(0,0,0,.18);
    }
    .manager-head{
      display:flex;align-items:center;justify-content:space-between;
      margin-bottom:14px;
    }
    .manager-title{font-size:17px;font-weight:800}
    .category-list{margin-bottom:14px}
    .category-row{
      display:grid;
      grid-template-columns:34px 44px 1fr 44px;
      align-items:center;
      gap:8px;
      padding:8px 0;
      border-bottom:1px solid var(--line);
      transition:transform .14s ease, background .14s ease, box-shadow .14s ease;
    }
    .category-row.dragging{
      background:#f7f8fb;
      box-shadow:0 8px 24px rgba(0,0,0,.10);
      border-radius:12px;
      padding-left:6px;
      padding-right:6px;
      opacity:.96;
    }
    .drag-handle{
      width:32px;height:38px;border:0;background:transparent;color:#9aa0aa;
      font-size:21px;font-weight:700;border-radius:9px;touch-action:none;user-select:none;
      -webkit-user-select:none;cursor:grab;display:grid;place-items:center;
    }
    .drag-handle:active{cursor:grabbing;background:#f2f4f8;color:#555d6d}
    .category-row input{
      border:1px solid #e1e4ea;
      border-radius:10px;
      padding:9px 10px;
      font-size:14px;
      width:100%;
    }
    .icon-input{
      text-align:center;
      font-size:20px !important;
      padding-left:3px !important;
      padding-right:3px !important;
    }
    .reorder{
      display:flex;
      gap:6px;
      justify-content:center;
    }
    .move-btn{
      border:none;
      background:#f2f4f8;
      color:#596173;
      width:34px;
      height:34px;
      border-radius:9px;
      font-size:16px;
      font-weight:800;
      cursor:pointer;
    }
    .move-btn:disabled{
      opacity:.35;
      cursor:default;
    }
    .delete-btn{
      border:none;background:#fff0f0;color:#e54b4b;
      width:38px;height:38px;border-radius:10px;cursor:pointer;
    }
    .add-box{
      background:#f7f8fb;
      border-radius:14px;
      padding:12px;
      margin-top:12px;
    }
    .add-box-title{font-size:12px;font-weight:800;margin-bottom:9px}
    .add-grid{
      display:grid;grid-template-columns:70px 1fr;gap:8px;
    }
    .add-grid input{
      border:1px solid #dfe3ea;border-radius:11px;
      padding:10px;font-size:14px;width:100%;
    }
    .add-btn{
      width:100%;border:none;background:var(--primary-soft);
      color:var(--primary);border-radius:11px;padding:10px;
      font-weight:800;margin-top:8px;cursor:pointer;
    }
    .manager-done{
      width:100%;border:none;background:var(--primary);
      color:#fff;border-radius:12px;padding:12px;
      font-size:14px;font-weight:800;margin-top:14px;cursor:pointer;
    }
  
    .subpage{padding:18px;display:none}
    .subpage.show{display:block}
    .subpage-title{font-size:20px;font-weight:800;margin:2px 0 14px}
    .range-tabs{display:flex;gap:8px;margin-bottom:12px}
    .range-tabs button{border:1px solid var(--line);background:#fff;color:var(--muted);padding:8px 13px;border-radius:999px;font-size:12px;font-weight:700}
    .range-tabs button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
    .period-row{display:flex;align-items:center;justify-content:space-between;margin:8px 0 12px}
    .period-row button{border:0;background:#fff;border-radius:10px;padding:8px 12px;box-shadow:var(--shadow)}
    .period-text{font-size:13px;font-weight:800}
    .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
    .stats-box{background:#fff;border-radius:16px;padding:12px;box-shadow:var(--shadow)}
    .stats-box span{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}
    .stats-box strong{font-size:16px}
    .stats-list{background:#fff;border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
    .stats-item{padding:13px 14px;border-bottom:1px solid var(--line);cursor:pointer}
    .stats-item:last-child{border-bottom:0}
    .stats-item-top{display:flex;align-items:center;gap:10px}
    .stats-icon{width:36px;height:36px;display:grid;place-items:center;background:#f4f5f8;border-radius:11px;font-size:19px}
    .stats-name{flex:1;font-size:13px;font-weight:800}
    .stats-value{text-align:right}.stats-value b{display:block;font-size:13px}.stats-value small{color:var(--muted);font-size:11px}
    .stats-bar{height:6px;background:#eef0f5;border-radius:999px;overflow:hidden;margin-top:9px}.stats-bar i{display:block;height:100%;background:var(--primary);border-radius:999px}
    .trend{background:#fff;border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-top:12px}
    .trend-title{font-size:13px;font-weight:800;margin-bottom:10px}.trend-bars{display:flex;align-items:flex-end;gap:6px;height:120px}.trend-col{flex:1;min-width:0;text-align:center}.trend-col i{display:block;background:var(--primary);border-radius:6px 6px 2px 2px;min-height:3px}.trend-col span{display:block;color:var(--muted);font-size:9px;margin-top:4px;white-space:nowrap;overflow:hidden}
    .detail-panel{display:none;background:#fff;border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-top:12px}.detail-panel.show{display:block}
    .detail-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.detail-head b{font-size:14px}.detail-head button{border:0;background:#f1f3f6;border-radius:9px;padding:7px 10px;font-size:11px}
    .detail-sort{display:flex;gap:6px;overflow:auto;margin-bottom:8px}.detail-sort button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 9px;font-size:10px}.detail-sort button.active{background:#202632;color:#fff;border-color:#202632}
    .simple-card{background:#fff;border-radius:18px;padding:14px;box-shadow:var(--shadow);font-size:13px;line-height:1.7;color:var(--muted)}

  </style>
</head>
<body>
  <div class="app">
    <section class="hero">
      <div class="topbar">
        <div class="title">我的账本</div>
        <div class="month">2026年10月</div>
      </div>

      <div class="balance-label">本月结余</div>
      <div class="balance" id="balance">¥5,182.00</div>

      <div class="summary">
        <div class="box">
          <div class="label">本月收入</div>
          <div class="value" id="incomeTotal">¥8,500.00</div>
        </div>
        <div class="box">
          <div class="label">本月支出</div>
          <div class="value" id="expenseTotal">¥3,318.00</div>
        </div>
      </div>
    </section>

    <main class="content">
      <section class="section">
        <div class="section-head">
          <div class="section-title">本月概览</div>
          <button class="small-btn">查看统计</button>
        </div>
        <div class="quick-stats">
          <div class="stat"><span>餐饮</span><strong>¥1,286</strong></div>
          <div class="stat"><span>交通</span><strong>¥620</strong></div>
          <div class="stat"><span>购物</span><strong>¥912</strong></div>
        </div>
      </section>

      <section class="section">
        <div class="section-head">
          <div class="section-title">最近账单</div>
          <button class="small-btn" onclick="openSheet()">记一笔</button>
        </div>
        <div id="billList"></div>
      </section>

    </main>

    <section class="subpage" id="pageBills">
      <div class="subpage-title">账单</div>
      <div class="section"><div id="allBillList"></div></div>
    </section>

    <section class="subpage" id="pageStats">
      <div class="subpage-title">统计</div>
      <div class="range-tabs">
        <button onclick="setStatsRange('week',this)">周</button>
        <button class="active" onclick="setStatsRange('month',this)">月</button>
        <button onclick="setStatsRange('year',this)">年</button>
      </div>
      <div class="period-row"><button onclick="shiftStats(-1)">‹</button><div class="period-text" id="statsPeriod"></div><button onclick="shiftStats(1)">›</button></div>
      <div class="stats-grid">
        <div class="stats-box"><span>总支出</span><strong id="statsExpense">¥0.00</strong></div>
        <div class="stats-box"><span>笔数</span><strong id="statsCount">0</strong></div>
        <div class="stats-box"><span>平均每笔</span><strong id="statsAvg">¥0.00</strong></div>
      </div>
      <div class="stats-list" id="statsCategoryList"></div>
      <div class="trend"><div class="trend-title">支出趋势</div><div class="trend-bars" id="trendBars"></div></div>
      <div class="detail-panel" id="statsDetail"><div class="detail-head"><b id="detailName">分类明细</b><button onclick="closeStatsDetail()">收起</button></div><div class="detail-sort">
        <button class="active" onclick="setDetailSort('newest',this)">最新优先</button><button onclick="setDetailSort('oldest',this)">最早优先</button><button onclick="setDetailSort('amountDesc',this)">金额高到低</button>
      </div><div id="statsDetailList"></div></div>
    </section>

    <section class="subpage" id="pageSettings">
      <div class="subpage-title">设置</div>

      <div class="section">
        <div class="section-head">
          <div class="section-title">分类</div>
          <span style="font-size:11px;color:var(--muted)">图标 · 名称 · 顺序</span>
        </div>
        <button class="small-btn" style="width:100%;padding:12px" onclick="openManager()">管理分类</button>
      </div>

      <div class="section">
        <div class="section-head">
          <div class="section-title">数据备份</div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <button class="small-btn" style="padding:11px" onclick="exportBackup()">导出 JSON 备份</button>
          <button class="small-btn" style="padding:11px" onclick="exportCsv()">导出 CSV 表格</button>
          <button class="small-btn" style="padding:11px" onclick="document.getElementById('importFile').click()">导入备份</button>
          <button class="small-btn" style="padding:11px" onclick="installApp()">安装到桌面</button>
        </div>
        <input id="importFile" type="file" accept=".json,application/json" style="display:none" onchange="importBackup(this.files[0])" />
        <div style="font-size:11px;color:#8d94a3;line-height:1.6;margin-top:10px">JSON 用于完整恢复；CSV 可用 Excel / WPS 查看。数据默认保存在当前手机浏览器本地。</div>
      </div>

      <div class="section">
        <div class="section-head"><div class="section-title">数据管理</div></div>
        <button class="small-btn" style="width:100%;padding:12px;background:#fff0f0;color:#d64545" onclick="clearBills()">清空全部账单</button>
        <div style="font-size:11px;color:#8d94a3;line-height:1.6;margin-top:10px">清空后无法撤销，建议先导出 JSON 备份。</div>
      </div>
    </section>
  </div>

  <button class="fab" onclick="openSheet()">＋</button>

  <div class="nav">
    <div class="active" data-nav="home" onclick="showPage('home',this)">首页</div>
    <div data-nav="bills" onclick="showPage('bills',this)">账单</div>
    <div data-nav="stats" onclick="showPage('stats',this)">统计</div>
    <div data-nav="settings" onclick="showPage('settings',this)">设置</div>
  </div>

  <div class="overlay" id="overlay" onclick="closeByBg(event)">
    <div class="sheet">
      <div class="sheet-title">
        <span>记一笔</span>
        <button class="close-x" onclick="closeSheet()">×</button>
      </div>

      <div class="tabs">
        <button id="expenseTab" class="tab active" onclick="setType('expense')">支出</button>
        <button id="incomeTab" class="tab" onclick="setType('income')">收入</button>
      </div>

      <div class="field">
        <label>金额</label>
        <input id="amountInput" type="number" inputmode="decimal" placeholder="0.00" />
      </div>

      <div class="category-head">
        <span>分类</span>
        <button class="manage-btn" onclick="openManager()">＋ 管理分类</button>
      </div>
      <div class="category-grid" id="categoryGrid"></div>

      <div class="row">
        <div class="field">
          <label>日期</label>
          <input id="dateInput" type="date" />
        </div>
        <div class="field">
          <label>备注</label>
          <input id="noteInput" type="text" placeholder="可选" />
        </div>
      </div>

      <button class="save" onclick="saveBill()">保存</button>
      <button class="cancel" onclick="closeSheet()">取消</button>
    </div>
  </div>

  <div class="manager" id="manager" onclick="closeManagerBg(event)">
    <div class="manager-card">
      <div class="manager-head">
        <div class="manager-title">管理分类</div>
        <button class="close-x" onclick="closeManager()">×</button>
      </div>

      <div class="hint" style="margin:-4px 0 8px">按住左侧 ≡ 约 0.3 秒后，上下拖动即可自由排序。</div>
      <div class="category-list" id="categoryList"></div>

      <div class="add-box">
        <div class="add-box-title">新增分类</div>
        <div class="add-grid">
          <input id="newIcon" class="icon-input" placeholder="☕" maxlength="4" />
          <input id="newName" placeholder="例如：咖啡" maxlength="10" />
        </div>
        <button class="add-btn" onclick="addCategory()">新增分类</button>
      </div>

      <button class="manager-done" onclick="closeManager()">完成</button>
    </div>
  </div>

  <script>
    let currentType = 'expense';
    let selectedCategoryId = 'food';

    const STORAGE_KEY = 'jizhang_pwa_v1';
    const DEFAULT_CATEGORIES = [
      {id:'food', name:'餐饮', icon:'🍜'}, {id:'transport', name:'交通', icon:'🚕'},
      {id:'shopping', name:'购物', icon:'🛍️'}, {id:'housing', name:'住房', icon:'🏠'},
      {id:'entertainment', name:'娱乐', icon:'🎬'}, {id:'salary', name:'工资', icon:'💰'},
      {id:'medical', name:'医疗', icon:'💊'}, {id:'other', name:'其他', icon:'🧾'}
    ];
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch(e) {}
    let categories = saved?.categories || JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
    let bills = saved?.bills || [];
    function persist(){ localStorage.setItem(STORAGE_KEY, JSON.stringify({categories,bills})); }

    function uid(){
      return 'c_' + Date.now() + '_' + Math.floor(Math.random()*10000);
    }

    function renderCategories(){
      const grid = document.getElementById('categoryGrid');
      if(!categories.find(c => c.id === selectedCategoryId) && categories.length){
        selectedCategoryId = categories[0].id;
      }
      grid.innerHTML = categories.map(c => `
        <div class="cat ${c.id === selectedCategoryId ? 'active' : ''}" onclick="selectCategory('${c.id}')">
          <div class="cat-icon">${escapeHtml(c.icon || '🧾')}</div>
          <div class="cat-name">${escapeHtml(c.name)}</div>
        </div>
      `).join('');
    }

    function selectCategory(id){
      selectedCategoryId = id;
      renderCategories();
    }

    function renderManager(){
      const list = document.getElementById('categoryList');
      list.innerHTML = categories.map((c,index) => `
        <div class="category-row" data-category-id="${c.id}">
          <button class="drag-handle" aria-label="长按拖动 ${escapeAttr(c.name)}" title="长按拖动">≡</button>
          <input class="icon-input" value="${escapeAttr(c.icon)}" maxlength="4"
                 onchange="updateCategory('${c.id}','icon',this.value)" />
          <input value="${escapeAttr(c.name)}" maxlength="10"
                 onchange="updateCategory('${c.id}','name',this.value)" />
          <button class="delete-btn" onclick="deleteCategory('${c.id}')">删</button>
        </div>
      `).join('');
      setupCategoryDrag();
    }

    let dragState = null;
    function setupCategoryDrag(){
      const list = document.getElementById('categoryList');
      list.querySelectorAll('.category-row').forEach(row => {
        const handle = row.querySelector('.drag-handle');
        let holdTimer = null;
        let startX = 0, startY = 0;

        handle.onpointerdown = (e) => {
          startX = e.clientX; startY = e.clientY;
          holdTimer = setTimeout(() => startCategoryDrag(e.pointerId, row, handle, e.clientY), 320);
          handle.setPointerCapture?.(e.pointerId);
        };
        handle.onpointermove = (e) => {
          if(dragState && dragState.pointerId === e.pointerId){
            e.preventDefault();
            moveCategoryDrag(e.clientY);
          } else if(holdTimer && (Math.abs(e.clientX-startX)>10 || Math.abs(e.clientY-startY)>10)){
            clearTimeout(holdTimer); holdTimer = null;
          }
        };
        const finish = (e) => {
          if(holdTimer){ clearTimeout(holdTimer); holdTimer = null; }
          if(dragState && dragState.pointerId === e.pointerId) endCategoryDrag();
        };
        handle.onpointerup = finish;
        handle.onpointercancel = finish;
      });
    }

    function startCategoryDrag(pointerId, row, handle, y){
      if(navigator.vibrate) navigator.vibrate(25);
      dragState = {pointerId, id:row.dataset.categoryId, row, handle};
      row.classList.add('dragging');
      moveCategoryDrag(y);
    }

    function moveCategoryDrag(clientY){
      if(!dragState) return;
      const list = document.getElementById('categoryList');
      const rows = [...list.querySelectorAll('.category-row')];
      const dragging = dragState.row;
      const others = rows.filter(r => r !== dragging);
      let before = null;
      for(const r of others){
        const rect = r.getBoundingClientRect();
        if(clientY < rect.top + rect.height/2){ before = r; break; }
      }
      if(before) list.insertBefore(dragging, before); else list.appendChild(dragging);
    }

    function endCategoryDrag(){
      if(!dragState) return;
      dragState.row.classList.remove('dragging');
      const orderedIds = [...document.querySelectorAll('#categoryList .category-row')].map(r => r.dataset.categoryId);
      categories = orderedIds.map(id => categories.find(c => c.id === id)).filter(Boolean);
      persist();
      renderCategories();
      renderManager();
      dragState = null;
    }

    function moveCategory(id, direction){
      const index = categories.findIndex(c => c.id === id);
      if(index < 0) return;

      const targetIndex = index + direction;
      if(targetIndex < 0 || targetIndex >= categories.length) return;

      const temp = categories[index];
      categories[index] = categories[targetIndex];
      categories[targetIndex] = temp;

      renderManager();
      renderCategories();
      persist();
    }

    function updateCategory(id, field, value){
      const c = categories.find(x => x.id === id);
      if(!c) return;
      value = value.trim();
      if(!value) return;
      c[field] = value;
      renderCategories();
      renderBills();
      persist();
    }

    function deleteCategory(id){
      if(categories.length <= 1){
        alert('至少保留一个分类');
        return;
      }
      const c = categories.find(x => x.id === id);
      if(!confirm(`删除分类“${c ? c.name : ''}”吗？`)) return;
      categories = categories.filter(x => x.id !== id);
      if(selectedCategoryId === id) selectedCategoryId = categories[0].id;
      renderManager();
      renderCategories();
      persist();
    }

    function addCategory(){
      const iconEl = document.getElementById('newIcon');
      const nameEl = document.getElementById('newName');
      const icon = iconEl.value.trim() || '🧾';
      const name = nameEl.value.trim();
      if(!name){
        alert('请输入分类名称');
        return;
      }
      const id = uid();
      categories.push({id, name, icon});
      selectedCategoryId = id;
      iconEl.value = '';
      nameEl.value = '';
      renderManager();
      renderCategories();
      persist();
    }

    function openManager(){
      renderManager();
      document.getElementById('manager').classList.add('show');
    }
    function closeManager(){
      document.getElementById('manager').classList.remove('show');
    }
    function closeManagerBg(e){
      if(e.target.id === 'manager') closeManager();
    }

    function renderBills(){
      const el = document.getElementById('billList');
      if(!bills.length){
        el.innerHTML = '<div style="text-align:center;color:#8d94a3;font-size:12px;padding:18px 0 4px">还没有账单</div>';
        updateTotals();
        return;
      }

      el.innerHTML = bills.map(b => {
        const liveCat = categories.find(c => c.id === b.categoryId);
        const icon = liveCat ? liveCat.icon : b.icon;
        const category = liveCat ? liveCat.name : b.category;
        return `
          <div class="bill">
            <div class="icon">${escapeHtml(icon || '🧾')}</div>
            <div class="bill-main">
              <div class="bill-name">${escapeHtml(b.note || category)}</div>
              <div class="bill-note">${escapeHtml(category)} · ${escapeHtml(b.date)}</div>
            </div>
            <div class="amount ${b.type === 'expense' ? 'expense':'income'}">
              ${b.type === 'expense' ? '-':'+'} ¥${Number(b.amount).toFixed(2)}
            </div>
          </div>
        `;
      }).join('');
      updateTotals();
    }

    function updateTotals(){
      const income = bills.filter(b=>b.type==='income').reduce((s,b)=>s+Number(b.amount),0);
      const expense = bills.filter(b=>b.type==='expense').reduce((s,b)=>s+Number(b.amount),0);
      document.getElementById('incomeTotal').textContent = '¥' + income.toFixed(2);
      document.getElementById('expenseTotal').textContent = '¥' + expense.toFixed(2);
      document.getElementById('balance').textContent = '¥' + (income-expense).toFixed(2);
    }

    function openSheet(){
      document.getElementById('overlay').classList.add('show');
      const d = new Date();
      document.getElementById('dateInput').value =
        `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }
    function closeSheet(){
      document.getElementById('overlay').classList.remove('show');
    }
    function closeByBg(e){
      if(e.target.id === 'overlay') closeSheet();
    }

    function setType(type){
      currentType = type;
      document.getElementById('expenseTab').classList.toggle('active', type === 'expense');
      document.getElementById('incomeTab').classList.toggle('active', type === 'income');
    }

    function saveBill(){
      const amount = parseFloat(document.getElementById('amountInput').value);
      const note = document.getElementById('noteInput').value.trim();
      const date = document.getElementById('dateInput').value;

      if(!amount || amount <= 0){
        alert('请输入正确的金额');
        return;
      }

      const cat = categories.find(c => c.id === selectedCategoryId);
      if(!cat){
        alert('请选择分类');
        return;
      }

      bills.unshift({
        type:currentType,
        categoryId:cat.id,
        category:cat.name,
        note:note || cat.name,
        amount,
        icon:cat.icon,
        date:date || '今天'
      });

      document.getElementById('amountInput').value = '';
      document.getElementById('noteInput').value = '';
      renderBills();
      persist();
      closeSheet();
    }

    function escapeHtml(str){
      return String(str ?? '')
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'",'&#039;');
    }

    function escapeAttr(str){
      return escapeHtml(str).replaceAll('`','&#096;');
    }

    function safeFileDate(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    function downloadFile(name,type,text){
      const blob=new Blob([text],{type}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1200);
    }
    function exportBackup(){
      downloadFile(`记账备份_${safeFileDate()}.json`,'application/json;charset=utf-8',JSON.stringify({version:1,exportedAt:new Date().toISOString(),categories,bills},null,2));
    }
    function exportCsv(){
      const rows=[['日期','类型','分类','金额','备注']];
      bills.forEach(b=>{const c=categories.find(x=>x.id===b.categoryId); rows.push([b.date,b.type==='expense'?'支出':'收入',c?.name||b.category||'',b.amount,b.note||'']);});
      const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');
      downloadFile(`记账账单_${safeFileDate()}.csv`,'text/csv;charset=utf-8',csv);
    }
    async function importBackup(file){
      if(!file) return;
      try{ const obj=JSON.parse(await file.text()); if(!Array.isArray(obj.categories)||!Array.isArray(obj.bills)) throw new Error('文件格式不正确');
        if(confirm(`将导入 ${obj.bills.length} 笔账单并覆盖当前数据，继续？`)){ categories=obj.categories; bills=obj.bills; persist(); renderCategories(); renderBills(); alert('导入完成'); }
      }catch(e){ alert('导入失败：'+e.message); }
      document.getElementById('importFile').value='';
    }
    function clearBills(){ if(confirm('确定清空全部账单？')){ bills=[]; persist(); renderBills(); } }
    let deferredPrompt=null;
    window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; });
    async function installApp(){
      if(deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; }
      else alert('请使用支持 PWA 的浏览器打开 HTTPS 地址，然后在浏览器菜单中选择“安装应用”或“添加到主屏幕”。');
    }
    if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{})); }

    renderCategories();
    renderBills();


    // ---- Multi-page navigation + statistics + settings (v3 fix) ----
    let statsRange = 'month';
    let statsAnchor = new Date();
    let detailCategoryId = null;
    let detailSort = 'newest';

    function showPage(page, el){
      document.querySelectorAll('.nav > div').forEach(n=>n.classList.remove('active'));
      if(el) el.classList.add('active');
      document.querySelector('.hero').style.display = page==='home' ? '' : 'none';
      document.querySelector('main.content').style.display = page==='home' ? '' : 'none';
      document.getElementById('pageBills').classList.toggle('show', page==='bills');
      document.getElementById('pageStats').classList.toggle('show', page==='stats');
      document.getElementById('pageSettings').classList.toggle('show', page==='settings');
      if(page==='bills') renderAllBills();
      if(page==='stats'){
        // 每次重新进入统计页，都自动回到今天所在的周/月/年。
        statsAnchor = new Date();
        closeStatsDetail();
        renderStats();
      }
    }

    function renderAllBills(){
      const el=document.getElementById('allBillList');
      const arr=[...bills].sort((a,b)=>String(b.date).localeCompare(String(a.date)));
      el.innerHTML=arr.length ? arr.map(b=>{
        const c=categories.find(x=>x.id===b.categoryId); const name=c?.name||b.category||'未分类'; const icon=c?.icon||b.icon||'🧾';
        return `<div class="bill"><div class="icon">${escapeHtml(icon)}</div><div class="bill-main"><div class="bill-name">${escapeHtml(b.note||name)}</div><div class="bill-note">${escapeHtml(name)} · ${escapeHtml(b.date)}</div></div><div class="amount ${b.type==='expense'?'expense':'income'}">${b.type==='expense'?'-':'+'} ¥${Number(b.amount).toFixed(2)}</div></div>`;
      }).join('') : '<div style="text-align:center;color:#8d94a3;font-size:12px;padding:18px">暂无账单</div>';
    }

    function setStatsRange(range,btn){
      statsRange=range; statsAnchor=new Date();
      document.querySelectorAll('.range-tabs button').forEach(b=>b.classList.remove('active')); if(btn)btn.classList.add('active');
      closeStatsDetail(); renderStats();
    }
    function shiftStats(n){
      if(statsRange==='week') statsAnchor.setDate(statsAnchor.getDate()+7*n);
      else if(statsRange==='month') statsAnchor.setMonth(statsAnchor.getMonth()+n);
      else statsAnchor.setFullYear(statsAnchor.getFullYear()+n);
      closeStatsDetail(); renderStats();
    }
    function statsPeriodBounds(){
      const a=new Date(statsAnchor); a.setHours(0,0,0,0); let start,end,label;
      if(statsRange==='month'){ start=new Date(a.getFullYear(),a.getMonth(),1); end=new Date(a.getFullYear(),a.getMonth()+1,0,23,59,59,999); label=`${a.getFullYear()}年${a.getMonth()+1}月`; }
      else if(statsRange==='year'){ start=new Date(a.getFullYear(),0,1); end=new Date(a.getFullYear(),11,31,23,59,59,999); label=`${a.getFullYear()}年`; }
      else { const offset=(a.getDay()+6)%7; start=new Date(a); start.setDate(a.getDate()-offset); end=new Date(start); end.setDate(start.getDate()+6); end.setHours(23,59,59,999); label=`${start.getMonth()+1}/${start.getDate()} - ${end.getMonth()+1}/${end.getDate()}`; }
      return {start,end,label};
    }
    function statsBills(){ const p=statsPeriodBounds(); return bills.filter(b=>{const d=new Date(String(b.date)+'T12:00:00'); return d>=p.start&&d<=p.end;}); }
    function renderStats(){
      const p=statsPeriodBounds(); document.getElementById('statsPeriod').textContent=p.label;
      const arr=statsBills().filter(b=>b.type==='expense'); const total=arr.reduce((s,b)=>s+Number(b.amount),0);
      document.getElementById('statsExpense').textContent='¥'+total.toFixed(2); document.getElementById('statsCount').textContent=arr.length; document.getElementById('statsAvg').textContent='¥'+(arr.length?total/arr.length:0).toFixed(2);
      const sums={}; arr.forEach(b=>sums[b.categoryId]=(sums[b.categoryId]||0)+Number(b.amount));
      const rows=Object.entries(sums).sort((a,b)=>b[1]-a[1]); const list=document.getElementById('statsCategoryList');
      list.innerHTML=rows.length?rows.map(([id,val])=>{const c=categories.find(x=>x.id===id)||{name:'未分类',icon:'🧾'}; const pct=total?val/total*100:0; return `<div class="stats-item" onclick="openStatsDetail('${id}')"><div class="stats-item-top"><div class="stats-icon">${escapeHtml(c.icon||'🧾')}</div><div class="stats-name">${escapeHtml(c.name||'未分类')}</div><div class="stats-value"><b>¥${val.toFixed(2)}</b><small>${pct.toFixed(1)}%</small></div></div><div class="stats-bar"><i style="width:${Math.max(2,pct)}%"></i></div></div>`}).join(''):'<div style="text-align:center;color:#8d94a3;font-size:12px;padding:22px">这个时间段暂无支出</div>';
      renderTrend(arr,p);
    }
    function renderTrend(arr,p){
      let buckets=[];
      if(statsRange==='week'){ for(let i=0;i<7;i++){let d=new Date(p.start);d.setDate(d.getDate()+i);buckets.push({key:d.toISOString().slice(0,10),label:'一二三四五六日'[i],v:0});} }
      else if(statsRange==='month'){ const days=new Date(p.start.getFullYear(),p.start.getMonth()+1,0).getDate(); const step=Math.ceil(days/6); for(let i=1;i<=days;i+=step)buckets.push({from:i,to:Math.min(days,i+step-1),label:String(i),v:0}); }
      else { for(let i=0;i<12;i++)buckets.push({month:i,label:String(i+1),v:0}); }
      arr.forEach(b=>{const d=new Date(String(b.date)+'T12:00:00'); if(statsRange==='week'){const k=String(b.date);const x=buckets.find(q=>q.key===k);if(x)x.v+=Number(b.amount);} else if(statsRange==='month'){const day=d.getDate();const x=buckets.find(q=>day>=q.from&&day<=q.to);if(x)x.v+=Number(b.amount);} else buckets[d.getMonth()].v+=Number(b.amount);});
      const max=Math.max(1,...buckets.map(x=>x.v)); document.getElementById('trendBars').innerHTML=buckets.map(x=>`<div class="trend-col" title="¥${x.v.toFixed(2)}"><i style="height:${Math.max(3,x.v/max*92)}px"></i><span>${x.label}</span></div>`).join('');
    }
    function openStatsDetail(id){ detailCategoryId=id; detailSort='newest'; const c=categories.find(x=>x.id===id)||{name:'未分类',icon:'🧾'}; document.getElementById('detailName').textContent=`${c.icon||'🧾'} ${c.name||'未分类'} 明细`; document.querySelectorAll('.detail-sort button').forEach((b,i)=>b.classList.toggle('active',i===0)); document.getElementById('statsDetail').classList.add('show'); renderStatsDetail(); }
    function closeStatsDetail(){ document.getElementById('statsDetail')?.classList.remove('show'); detailCategoryId=null; }
    function setDetailSort(sort,btn){ detailSort=sort; document.querySelectorAll('.detail-sort button').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); renderStatsDetail(); }
    function renderStatsDetail(){
      if(!detailCategoryId)return; let arr=statsBills().filter(b=>b.type==='expense'&&b.categoryId===detailCategoryId);
      arr.sort((a,b)=>detailSort==='amountDesc'?Number(b.amount)-Number(a.amount):detailSort==='oldest'?String(a.date).localeCompare(String(b.date)):String(b.date).localeCompare(String(a.date)));
      const c=categories.find(x=>x.id===detailCategoryId)||{name:'未分类',icon:'🧾'}; document.getElementById('statsDetailList').innerHTML=arr.length?arr.map(b=>`<div class="bill"><div class="icon">${escapeHtml(c.icon||'🧾')}</div><div class="bill-main"><div class="bill-name">${escapeHtml(b.note||c.name)}</div><div class="bill-note">${escapeHtml(b.date)}</div></div><div class="amount expense">- ¥${Number(b.amount).toFixed(2)}</div></div>`).join(''):'<div style="text-align:center;color:#8d94a3;font-size:12px;padding:14px">暂无记录</div>';
    }

    // Make the "查看统计" button on the home page work too.
    document.querySelectorAll('.small-btn').forEach(btn=>{ if(btn.textContent.trim()==='查看统计') btn.onclick=()=>showPage('stats',document.querySelector('[data-nav="stats"]')); });

  </script>
</body>
</html>
